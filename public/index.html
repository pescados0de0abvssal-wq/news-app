<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NewsReader">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>NewsReader</title>
</head>
<body>

  <!-- 画面1: 媒体選択 -->
  <div id="screen-select" class="screen active">
    <header class="app-header">
      <span class="app-icon">📰</span>
      <h1>NewsReader</h1>
      <p class="app-subtitle">世界のニュースを日本語で</p>
      <button id="settingsBtn" class="settings-btn" aria-label="設定">⚙️</button>
    </header>

    <main class="select-main">
      <div class="section-title">取得する媒体 <span class="section-title-hint">（⚙️で変更）</span></div>

      <!-- JS で動的に描画（renderSelectedSourcesOnHome） -->
      <div id="selected-source-list" class="selected-source-list"></div>

      <hr class="source-divider">

      <button id="btn-fetch" class="btn btn-primary">
        <span class="btn-icon">📡</span>
        最新ニュースを取得
      </button>

      <button id="btn-history" class="btn-history-toggle">過去の記事 ▾</button>

      <div id="history-menu" class="history-menu" style="display:none"></div>

      <div id="mock-notice" class="mock-notice">
        ⚠️ デモモード: モックデータを表示しています
      </div>
    </main>
  </div>

  <!-- 画面2: ニュース一覧 -->
  <div id="screen-list" class="screen">
    <header class="list-header">
      <button id="btn-back" class="btn-back">← トップに戻る</button>
      <h2>最新ニュース</h2>
    </header>

    <!-- セクションバー: list-main の外に置くことで記事との重なりをゼロにする -->
    <div id="section-bar" class="section-bar" aria-hidden="true">
      <span id="section-bar-flag" class="section-bar-flag"></span>
      <span id="section-bar-name" class="section-bar-name"></span>
    </div>

    <main id="news-list-main" class="list-main">
      <!-- JS で動的生成 -->
    </main>
  </div>

  <!-- 画面3: 要約モーダル -->
  <div id="modal-summary" class="modal" role="dialog" aria-modal="true">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-sheet">
      <div class="modal-handle"></div>

      <div class="modal-header">
        <span id="modal-source-badge" class="source-badge"></span>
        <button id="modal-close" class="btn-icon-only modal-close">✕</button>
      </div>

      <div class="modal-body">
        <h3 id="modal-title" class="modal-title"></h3>
        <div id="modal-date" class="modal-date"></div>
        <div id="modal-summary-text" class="modal-summary"></div>

        <!-- 関連記事タブ -->
        <div id="related-section" class="related-section" style="display:none">
          <div class="related-label">関連記事</div>
          <div id="related-tabs" class="related-tabs"></div>
          <div id="related-content" class="related-content"></div>
        </div>
      </div>

      <div class="modal-footer">
        <a id="modal-link" href="#" class="btn btn-primary">
          元記事を読む →
        </a>
      </div>
    </div>
  </div>

  <!-- ローディング -->
  <div id="loading-overlay" class="loading-overlay" style="display:none">
    <div class="loading-spinner"></div>
    <div class="loading-text">ニュースを取得中…</div>
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="settings-modal hidden">
    <div class="settings-content">
      <div class="settings-header">
        <h2>ニュース媒体を選択</h2>
        <button id="settingsClose" class="close-btn">✕</button>
      </div>
      <p class="settings-note">英語媒体を5つ選んでください（東洋経済は常に含まれます）</p>
      <p id="settingsCount" class="settings-count">0 / 5 選択中</p>
      <ul id="sourceList" class="source-list-settings"></ul>
      <button id="settingsSave" class="save-btn" disabled>保存する</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
